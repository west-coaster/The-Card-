<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE CARD — Race Predictor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --turf:#0F3D2E;
  --turf-dark:#092219;
  --parchment:#EFE7D8;
  --parchment-dim:#DED2B4;
  --brass:#C9A227;
  --brass-bright:#E8C34A;
  --silks:#8B2E22;
  --ink:#181410;
  --sage:#5C7A68;
  --line: rgba(239,231,216,0.14);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:
    radial-gradient(1200px 600px at 50% -200px, #14503C 0%, var(--turf) 55%, var(--turf-dark) 100%);
  color:var(--parchment);
  font-family:'Source Serif 4', serif;
  min-height:100vh;
  padding-bottom:60px;
}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}

::selection{background:var(--brass); color:var(--ink);}

/* ---------- HEADER ---------- */
header{
  padding:28px 20px 20px;
  text-align:center;
  border-bottom:1px solid var(--line);
  position:relative;
  overflow:hidden;
}
header::before{
  content:"";
  position:absolute; inset:0;
  background-image: repeating-linear-gradient(90deg, transparent, transparent 38px, rgba(201,162,39,0.05) 38px, rgba(201,162,39,0.05) 39px);
  pointer-events:none;
}
.eyebrow{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  letter-spacing:0.32em;
  color:var(--brass);
  text-transform:uppercase;
  margin-bottom:10px;
}
h1.wordmark{
  font-family:'Oswald', sans-serif;
  font-weight:700;
  font-size:clamp(40px, 12vw, 64px);
  letter-spacing:0.04em;
  line-height:0.9;
  color:var(--parchment);
  text-shadow: 0 2px 0 rgba(0,0,0,0.3);
}
h1.wordmark span{color:var(--brass-bright);}
.tagline{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  color:var(--sage);
  margin-top:10px;
  letter-spacing:0.06em;
}
.tagline b{color:var(--parchment-dim); font-weight:500;}

/* tote flip strip */
.tote-strip{
  display:flex; justify-content:center; gap:6px;
  margin-top:18px; flex-wrap:wrap;
}
.tote-digit{
  width:30px; height:40px;
  background:var(--ink);
  border:1px solid var(--brass);
  border-radius:2px;
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono', monospace;
  font-weight:700; font-size:20px;
  color:var(--brass-bright);
  position:relative;
  animation: flip 2.6s steps(1) infinite;
  animation-delay: calc(var(--d, 0) * 0.12s);
}
.tote-digit::after{
  content:"";
  position:absolute; left:0; right:0; top:50%;
  height:1px; background:rgba(0,0,0,0.5);
}
@keyframes flip{
  0%, 70%{ transform: rotateX(0deg); }
  75%{ transform: rotateX(90deg); }
  80%{ transform: rotateX(0deg); }
  100%{ transform: rotateX(0deg); }
}
@media (prefers-reduced-motion: reduce){
  .tote-digit{ animation:none; }
}

/* ---------- TRACK TABS ---------- */
.region-tabs{
  display:flex; gap:2px;
  max-width:720px; margin:22px auto 0; padding:0 16px;
}
.region-tab{
  flex:1;
  background:transparent;
  border:1px solid var(--line);
  color:var(--parchment-dim);
  font-family:'Oswald', sans-serif;
  font-weight:500;
  font-size:13px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  padding:11px 6px;
  transition:all .15s ease;
}
.region-tab.active{
  background:var(--brass);
  border-color:var(--brass);
  color:var(--ink);
}
.region-tab:not(.active):hover{border-color:var(--brass); color:var(--brass-bright);}

.track-rail{
  display:flex; gap:8px; overflow-x:auto;
  max-width:720px; margin:14px auto 0; padding:2px 16px 8px;
  scrollbar-width:none;
}
.track-rail::-webkit-scrollbar{display:none;}
.track-chip{
  flex:0 0 auto;
  background:rgba(239,231,216,0.05);
  border:1px solid var(--line);
  color:var(--parchment-dim);
  font-family:'JetBrains Mono', monospace;
  font-size:12px;
  padding:8px 14px;
  border-radius:20px;
  white-space:nowrap;
}
.track-chip.active{
  border-color:var(--brass-bright);
  color:var(--brass-bright);
  background:rgba(201,162,39,0.12);
}

/* ---------- RACE CARDS ---------- */
main{max-width:720px; margin:0 auto; padding:22px 14px 0;}

.race-card{
  background:rgba(239,231,216,0.035);
  border:1px solid var(--line);
  border-radius:6px;
  margin-bottom:18px;
  overflow:hidden;
}
.race-head{
  padding:16px 16px 12px;
  border-bottom:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
}
.race-head-left .race-num{
  font-family:'JetBrains Mono', monospace;
  font-size:11px; letter-spacing:0.15em;
  color:var(--brass); text-transform:uppercase;
}
.race-head-left h2{
  font-family:'Oswald', sans-serif;
  font-weight:600; font-size:20px;
  letter-spacing:0.01em;
  margin-top:2px;
}
.race-meta{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  color:var(--sage);
  margin-top:4px;
}

.going-gauge{
  text-align:right; flex-shrink:0;
}
.going-label{
  font-family:'JetBrains Mono', monospace;
  font-size:10px; letter-spacing:0.1em;
  color:var(--sage); text-transform:uppercase;
}
.going-value{
  font-family:'Oswald', sans-serif;
  font-weight:600; font-size:14px;
  color:var(--brass-bright);
}
.going-bar{
  width:90px; height:5px; border-radius:3px;
  background:rgba(239,231,216,0.12);
  margin-top:5px; position:relative; overflow:hidden;
}
.going-bar i{
  position:absolute; top:0; bottom:0; left:0;
  background: linear-gradient(90deg, var(--sage), var(--brass-bright));
  border-radius:3px;
}

.horse-table{width:100%; border-collapse:collapse;}
.horse-row{
  border-top:1px solid var(--line);
}
.horse-row td{
  padding:11px 10px;
  vertical-align:middle;
  font-size:13px;
}
.col-draw{
  width:28px; text-align:center;
  font-family:'JetBrains Mono', monospace;
  color:var(--sage); font-size:12px;
}
.silk{
  width:16px; height:16px; border-radius:50%;
  border:1.5px solid rgba(239,231,216,0.5);
  display:inline-block;
  flex-shrink:0;
}
.col-horse{padding-left:4px;}
.horse-name{
  font-family:'Oswald', sans-serif;
  font-weight:600; font-size:14.5px;
  display:flex; align-items:center; gap:8px;
}
.jockey-name{
  font-size:11.5px; color:var(--parchment-dim);
  opacity:0.75; margin-top:2px;
}
.col-ai{width:74px; text-align:right;}
.ai-pct{
  font-family:'JetBrains Mono', monospace;
  font-weight:700; font-size:15px;
  color:var(--brass-bright);
}
.ai-tag{
  font-size:9px; letter-spacing:0.08em;
  color:var(--sage); text-transform:uppercase;
}
.col-info{width:34px; text-align:center;}
.info-btn{
  width:26px; height:26px; border-radius:50%;
  border:1px solid var(--brass);
  background:transparent;
  color:var(--brass-bright);
  font-family:'Source Serif 4', serif;
  font-style:italic; font-weight:600;
  font-size:13px;
  line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
  transition: background .15s ease, color .15s ease;
}
.info-btn:hover, .info-btn:focus-visible{
  background:var(--brass); color:var(--ink);
  outline:2px solid var(--brass-bright); outline-offset:2px;
}

.top-pick-row td{background:rgba(201,162,39,0.06);}
.pick-flag{
  font-family:'JetBrains Mono', monospace;
  font-size:9px; letter-spacing:0.1em;
  color:var(--ink); background:var(--brass-bright);
  padding:2px 5px; border-radius:2px;
  margin-left:8px; vertical-align:middle;
}

footer{
  text-align:center;
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px;
  color:var(--sage);
  padding:30px 20px 10px;
  letter-spacing:0.04em;
  line-height:1.7;
}

/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(9,34,25,0.82);
  backdrop-filter:blur(2px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}
.modal-overlay.open{display:flex;}
.modal-sheet{
  background: linear-gradient(180deg, #123D2F, var(--turf-dark));
  border:1px solid var(--brass);
  border-bottom:none;
  border-radius:14px 14px 0 0;
  width:100%; max-width:520px;
  max-height:84vh;
  overflow-y:auto;
  padding:22px 22px 30px;
  animation: sheetUp .22s ease;
}
@media(min-width:560px){
  .modal-overlay{align-items:center;}
  .modal-sheet{border-radius:10px; border-bottom:1px solid var(--brass);}
}
@keyframes sheetUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }

.modal-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.modal-top h3{
  font-family:'Oswald', sans-serif;
  font-weight:700; font-size:24px;
}
.modal-close{
  background:transparent; border:none;
  color:var(--parchment-dim); font-size:22px;
  line-height:1; padding:4px;
}
.modal-sub{
  font-family:'JetBrains Mono', monospace;
  font-size:11px; color:var(--brass); margin-top:4px; letter-spacing:0.05em;
}
.modal-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;
  margin-top:20px;
}
.modal-field{
  border-top:1px solid var(--line); padding-top:8px;
}
.modal-field .k{
  font-family:'JetBrains Mono', monospace;
  font-size:9.5px; letter-spacing:0.1em;
  color:var(--sage); text-transform:uppercase;
}
.modal-field .v{
  font-size:14.5px; margin-top:3px; color:var(--parchment);
}
.modal-form{
  margin-top:18px; padding-top:14px; border-top:1px solid var(--line);
}
.modal-form .k{
  font-family:'JetBrains Mono', monospace;
  font-size:9.5px; letter-spacing:0.1em;
  color:var(--sage); text-transform:uppercase; margin-bottom:8px;
}
.form-runs{display:flex; gap:6px;}
.form-pos{
  width:26px; height:26px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono', monospace;
  font-size:11px; font-weight:700;
  background:rgba(239,231,216,0.08);
  color:var(--parchment-dim);
}
.form-pos.win{background:var(--brass-bright); color:var(--ink);}
.form-pos.place{background:rgba(201,162,39,0.35); color:var(--parchment);}

.ai-block{
  margin-top:18px; padding:16px;
  background:rgba(0,0,0,0.22);
  border:1px solid var(--line);
  border-radius:8px;
}
.ai-block .k{
  font-family:'JetBrains Mono', monospace;
  font-size:9.5px; letter-spacing:0.1em;
  color:var(--sage); text-transform:uppercase; margin-bottom:10px;
}
.ai-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:10px;}
.ai-row .lbl{font-size:12.5px; color:var(--parchment-dim); flex-shrink:0; width:96px;}
.ai-row .bar{flex:1; height:6px; background:rgba(239,231,216,0.1); border-radius:3px; overflow:hidden;}
.ai-row .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--sage),var(--brass-bright)); border-radius:3px;}
.ai-row .num{
  font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--brass-bright); width:34px; text-align:right;
}
.ai-note{
  margin-top:12px; font-size:12.5px; color:var(--parchment-dim); line-height:1.5;
  font-style:italic;
}
</style>
</head>

// ---------------- STATE ----------------
let currentRegion = 'ZA';
let currentTrack = TRACKS.ZA[0].id;

function trackMeta(id){
  return [...TRACKS.ZA, ...TRACKS.INTL].find(t=>t.id===id);
}

function renderTrackRail(){
  const rail = document.getElementById('trackRail');
  rail.innerHTML = '';
  TRACKS[currentRegion].forEach(t=>{
    const chip = document.createElement('button');
    chip.className = 'track-chip' + (t.id===currentTrack ? ' active':'');
    chip.textContent = t.name;
    chip.onclick = ()=>{ currentTrack = t.id; renderTrackRail(); renderMain(); };
    rail.appendChild(chip);
  });
}

function renderMain(){
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  const races = RACES[currentTrack] || [];
  const meta = trackMeta(currentTrack);

  races.forEach((race, ri)=>{
    const card = document.createElement('section');
    card.className = 'race-card';

    const topAi = Math.max(...race.horses.map(h=>h.ai));

    card.innerHTML = `
      <div class="race-head">
        <div class="race-head-left">
          <div class="race-num">Race ${ri+1} · ${meta.name}, ${meta.city}</div>
          <h2>${race.name}</h2>
          <div class="race-meta">${race.time} &nbsp;·&nbsp; ${race.dist} &nbsp;·&nbsp; ${race.cls} &nbsp;·&nbsp; ${race.prizeK}</div>
        </div>
        <div class="going-gauge">
          <div class="going-label">Going</div>
          <div class="going-value">${race.going}</div>
          <div class="going-bar"><i style="width:${GOING_SCALE[race.going] ?? 60}%"></i></div>
        </div>
      </div>
      <table class="horse-table">
        <tbody>
          ${race.horses.map((h,i)=>`
            <tr class="horse-row${h.ai===topAi ? ' top-pick-row':''}">
              <td class="col-draw">${h.draw}</td>
              <td class="col-horse">
                <div class="horse-name">
                  <span class="silk" style="background:${silk(i)}"></span>
                  ${h.name}${h.ai===topAi ? '<span class="pick-flag">AI PICK</span>':''}
                </div>
                <div class="jockey-name">${h.jockey} · ${h.weight}</div>
              </td>
              <td class="col-ai">
                <div class="ai-pct">${h.ai}%</div>
                <div class="ai-tag">win chance</div>
              </td>
              <td class="col-info">
                <button class="info-btn" aria-label="Details for ${h.name}" data-track="${currentTrack}" data-race="${ri}" data-horse="${i}">i</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    main.appendChild(card);
  });

  main.querySelectorAll('.info-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const race = RACES[btn.dataset.track][btn.dataset.race];
      const horse = race.horses[btn.dataset.horse];
      openModal(race, horse, trackMeta(btn.dataset.track));
    });
  });
}

// ---------------- MODAL ----------------
function formBadge(pos){
  const cls = pos===1 ? 'win' : (pos<=3 ? 'place' : '');
  return `<div class="form-pos ${cls}">${pos}</div>`;
}

function openModal(race, horse, meta){
  const sheet = document.getElementById('modalSheet');
  sheet.innerHTML = `
    <div class="modal-top">
      <div>
        <h3>${horse.name}</h3>
        <div class="modal-sub">DRAW ${horse.draw} &nbsp;·&nbsp; ${horse.weight}</div>
      </div>
      <button class="modal-close" aria-label="Close">&times;</button>
    </div>

    <div class="modal-grid">
      <div class="modal-field"><div class="k">Jockey</div><div class="v">${horse.jockey}</div></div>
      <div class="modal-field"><div class="k">Trainer</div><div class="v">${horse.trainer}</div></div>
      <div class="modal-field"><div class="k">Track</div><div class="v">${meta.name}, ${meta.city}</div></div>
      <div class="modal-field"><div class="k">Going</div><div class="v">${race.going}</div></div>
      <div class="modal-field"><div class="k">Distance</div><div class="v">${race.dist}</div></div>
      <div class="modal-field"><div class="k">Class</div><div class="v">${race.cls}</div></div>
    </div>

    <div class="modal-form">
      <div class="k">Recent form (last five, most recent first)</div>
      <div class="form-runs">${horse.form.map(formBadge).join('')}</div>
    </div>

    <div class="ai-block">
      <div class="k">AI prediction breakdown</div>
      <div class="ai-row"><div class="lbl">Win chance</div><div class="bar"><i style="width:${horse.ai}%"></i></div><div class="num">${horse.ai}%</div></div>
      <div class="ai-row"><div class="lbl">Going fit</div><div class="bar"><i style="width:${Math.min(96, horse.ai+22)}%"></i></div><div class="num">${Math.min(96, horse.ai+22)}%</div></div>
      <div class="ai-row"><div class="lbl">Form trend</div><div class="bar"><i style="width:${Math.min(96, horse.ai+12)}%"></i></div><div class="num">${Math.min(96, horse.ai+12)}%</div></div>
      <div class="ai-note">${horse.note}</div>
    </div>
  `;
  sheet.querySelector('.modal-close').onclick = closeModal;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay') closeModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeModal();
});                                                             
// ---------------- REGION TABS ----------------                document.querySelectorAll('.region-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{                               document.querySelectorAll('.region-tab').forEach(t=>t.classList.remove('active'));                                              tab.classList.add('active');
    currentRegion = tab.dataset.region;                             currentTrack = TRACKS[currentRegion][0].id;
    renderTrackRail();                                              renderMain();
  });                                                           });
                                                                // ---------------- INIT ----------------
renderTrackRail();                                              renderMain();                                                   </script>
